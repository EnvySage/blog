name: Deploy Static Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      # 直接使用现有 dist 目录（跳过构建）
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"  # 关键修改：指定你的 dist 目录
        
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
